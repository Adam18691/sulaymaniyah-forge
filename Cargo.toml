[package]
name = "sulaymaniyah-forge"
version = "2.0.0"
edition = "2021"
description = "200 Free Models - Ebook - Images - 12GB RAM - Rust > Go"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"
